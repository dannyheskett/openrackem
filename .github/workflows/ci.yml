name: ci

# Pull-request gate for every C/raylib game repo. Each job rebuilds raylib from source for
# its platform (the install dirs are gitignored), then builds the game.
#
# Callers pass `platforms` as a JSON array literal, e.g. '["linux","windows","mac"]'.
# Gating uses contains(fromJSON(...)) for exact list membership: contains() on a plain
# string is substring matching, so a csv would make 'mac' true for anything containing it.
#
# Jobs that are gated off report as skipped, which satisfies a required status check.
# Jobs that never trigger at all do NOT report, which blocks a PR forever -- that is why
# callers carry no paths-ignore.
#
# Check names in the calling repo are "<caller-job-id> / <job-id>", e.g. "ci / linux".

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install raylib build + runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libasound2-dev libssl-dev
      - name: Build raylib (Linux, static)
        run: ./scripts/build_raylib_linux.sh
      - name: Run tests
        run: make test
      - name: Build dev + release
        run: make all release
      - name: Build multiplayer daemon
        run: make server
      - name: Online end-to-end (daemon + two clients over loopback)
        run: make net-e2e

  windows:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install mingw cross-toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          # C99 cross-compile only: the two mingw C compilers + binutils directly. The
          # `mingw-w64` metapackage pulls the whole g++ toolchain (both arches x
          # posix/win32) + perl -- 39 packages / 241 MB, none of which this build uses.
          # binutils-mingw-w64 supplies the *-ar that build_raylib_windows.sh invokes.
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 binutils-mingw-w64
      - name: Build raylib (mingw win64 + win32)
        run: ./scripts/build_raylib_windows.sh
      - name: Cross-compile Win64 + Win32
        run: make windows

  # Functional verification of the Windows online backend (net_win.c: winsock2 +
  # SChannel) on a real, GitHub-hosted Windows machine — no external box. Builds
  # the live smoke test with MinGW and runs it against the deployed Fly server,
  # exercising the SChannel TLS handshake, cert/hostname validation, and the wss
  # round-trip. Mirrors how the mac job verifies net_apple.mm.
  win-net:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make
      - name: Build + run online smoke test (net_win.c -> live wss)
        shell: msys2 {0}
        run: make win-net-test

  mac:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build raylib (universal arm64 + x86_64)
        run: ./scripts/build_raylib_mac.sh
      - name: Build universal binary
        run: make mac
      - name: Online client smoke test (net_apple.mm -> live wss)
        run: make mac-net-test

  web:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
      # The Linux toolchain is required even though nothing native ships from this job.
      # In openbounty the web target transitively builds the NATIVE binary first: the pack
      # embedded in openbounty.data is zipped by ./build/debug/openbounty --pack-dir. The
      # other web repos do not need it; installing it unconditionally costs a little time
      # and keeps one job body for all of them.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libasound2-dev
      - name: Build raylib (Linux)
        run: ./scripts/build_raylib_linux.sh
      - name: Build raylib (web)
        run: ./scripts/build_raylib_web.sh
      - name: Build WASM
        run: make web
      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/web

  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      NDK_VERSION: "26.3.11579264"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ANDROID_PLATFORM_VER: "35"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install NDK + build-tools + platform
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platforms;android-${ANDROID_PLATFORM_VER}"
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Build raylib (Android, arm64-v8a static)
        run: ./scripts/build_raylib_android.sh
      - name: Build OpenSSL (Android arm64-v8a, static — wss for the APK)
        run: ./scripts/build_openssl_android.sh arm64-v8a
      - name: Build APK (sideload)
        run: |
          make android \
            ANDROID_BUILD_TOOLS="${ANDROID_BUILD_TOOLS}" \
            ANDROID_PLATFORM_VER="${ANDROID_PLATFORM_VER}"
      # Validate the Play packaging pipeline (aapt2 + bundletool) on every PR, debug-signed.
      # Proves the .aab builds without needing the real upload key; the release workflow
      # swaps in the upload keystore when the secrets are set.
      - name: Build AAB (Play packaging check, debug-signed)
        run: |
          make android-play \
            ANDROID_BUILD_TOOLS="${ANDROID_BUILD_TOOLS}" \
            ANDROID_PLATFORM_VER="${ANDROID_PLATFORM_VER}"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/*.apk

  # Functional verification of the Android online backend (net_posix.c + static
  # OpenSSL + the embedded CA bundle) on a real Android userspace — an x86_64
  # emulator, no physical device. Builds the live smoke test as an Android-native
  # x86_64 executable, boots an AVD, adb-pushes it, and runs it against the Fly
  # server: exercises the OpenSSL wss handshake, embedded-root cert validation,
  # and the round-trip. Mirrors the win-net / mac jobs.
  android-net:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NDK_VERSION: "26.3.11579264"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Build OpenSSL (Android x86_64, static)
        run: ./scripts/build_openssl_android.sh x86_64
      - name: Build the Android x86_64 smoke test
        run: make android-net-build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator + run online smoke test (net_posix -> live wss)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          # emulator-runner executes `script` under /usr/bin/sh (dash); keep the
          # logic in a bash script file to avoid dash quirks with loops.
          script: bash scripts/android_net_test.sh

  ios:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build iOS Simulator app (native Metal, no raylib)
        run: make ios-sim
      - name: Boot Simulator, install, launch, screenshot
        run: |
          set -eux
          # Pick any available iPhone simulator on the runner image.
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d.values() for x in r if 'iPhone' in x.get('name','')))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          app=$(find build/ios-sim -maxdepth 1 -name '*.app' | head -1)
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          xcrun simctl install "$UDID" "$app"
          xcrun simctl launch "$UDID" "$bundle"
          sleep 4
          xcrun simctl io "$UDID" screenshot ios-shot.png
      - name: Upload Simulator screenshot
        uses: actions/upload-artifact@v7
        with:
          name: ios-sim-screenshot
          path: ios-shot.png
      - name: Build device .ipa (unsigned -- AWS Device Farm re-signs)
        run: make ios
      - name: Upload device .ipa
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: build/*.ipa
