<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover + no user scaling: a full-bleed, app-like mobile canvas. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>openrackem</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000;
               overflow: hidden; overscroll-behavior: none; }
  /* Lock the page so mobile Safari can't rubber-band scroll the canvas. */
  body { position: fixed; inset: 0; }
  #canvas { position: fixed; top: 0; left: 0; display: block; touch-action: none; outline: none; }
  /* The on-screen keyboard's target (see orKbd below): present and focusable,
     but invisible. 16px stops iOS Safari zooming the page on focus. */
  #kbd { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding: 0;
         border: 0; opacity: 0; font-size: 16px; caret-color: transparent; }
</style>
</head>
<body>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <input id="kbd" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters"
         spellcheck="false" enterkeyhint="done" aria-hidden="true" tabindex="-1">
  <script>
    // Preserve the WebGL drawing buffer so the game canvas can be captured
    // (screenshots, screen recording, and headless/automated capture). Without
    // this, the browser is free to discard the back buffer after compositing,
    // so a readback taken outside the render loop comes back blank/white. The
    // cost is negligible for a game this small. Must run before the WASM module
    // creates its GL context, so we patch getContext up front.
    (function () {
      var orig = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function (type, attrs) {
        if (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl') {
          attrs = attrs || {};
          if (attrs.preserveDrawingBuffer === undefined) attrs.preserveDrawingBuffer = true;
        }
        return orig.call(this, type, attrs);
      };
    })();

    // Safari workaround (entirely in Safari's own APIs — raylib is untouched):
    // raylib's web backend sizes the canvas from window.innerWidth/innerHeight.
    // On mobile Safari innerHeight is the *large* layout viewport (the area
    // behind the toolbar), so the bottom of the game gets
    // cut off. We shadow innerWidth/innerHeight with the visualViewport size —
    // the actually-visible area — BEFORE the WASM module loads, so raylib reads
    // the visible dimensions. Desktop is unaffected (visualViewport == inner*).
    (function () {
      var vv = window.visualViewport;
      if (!vv) return;
      try {
        Object.defineProperty(window, 'innerWidth',  { configurable: true, get: function () { return Math.round(vv.width);  } });
        Object.defineProperty(window, 'innerHeight', { configurable: true, get: function () { return Math.round(vv.height); } });
      } catch (e) { /* if the browser won't allow it, fall back to native inner* */ }
    })();

    var Module = { canvas: document.getElementById('canvas') };

    // The phone's own keyboard for the name / room-code screens (src/softkbd.c).
    // The game calls orKbd.set() when such a screen opens or closes and drains
    // orKbd.next() every frame: a character code, -1 for backspace, -2 for
    // Done, 0 when empty.
    //
    // Typing lands in a hidden <input>. Every change to its value is sent as
    // the backspaces and characters that turn the old value into the new one,
    // which copes with keyboards that compose and autocorrect whole words. The
    // value starts as a run of padding so a backspace always has something to
    // delete (and so fires an event) even before anything is typed.
    //
    // iOS Safari raises the keyboard only for a focus() made inside a touch
    // handler, and the game acts on taps a frame later; so while the keyboard
    // is wanted, every touch on the canvas focuses the input (see the focus
    // handling below) and the screen invites a tap on the field.
    window.orKbd = (function () {
      var PAD = '          ';
      var input = document.getElementById('kbd');
      var queue = [], last = PAD, want = false;
      var reset = function () {
        input.value = last = PAD;
        try { input.setSelectionRange(PAD.length, PAD.length); } catch (e) {}
      };
      var sync = function () {
        var v = input.value, i = 0;
        while (i < last.length && i < v.length && last[i] === v[i]) i++;
        for (var k = last.length; k > i; k--) queue.push(-1);
        for (var j = i; j < v.length; j++) {
          var c = v.charCodeAt(j);
          queue.push(c === 10 || c === 13 ? -2 : c);
        }
        last = v;
      };
      input.addEventListener('input', function (e) {
        sync();
        // Top the padding back up once a word is finished (never mid-word: that
        // would cut a keyboard's composition short).
        if (!e.isComposing && input.value.length < 4) reset();
      });
      // Keys typed into the input are the input's alone: stop them at the window
      // in the capture phase, ahead of any key listener the game's runtime adds,
      // so a keyboard that also sends key events can't type each letter twice.
      // (The text still lands: stopping propagation doesn't cancel the default.)
      ['keydown', 'keypress', 'keyup'].forEach(function (type) {
        window.addEventListener(type, function (e) {
          if (e.target !== input) return;
          e.stopImmediatePropagation();
          if (type === 'keydown' && e.key === 'Enter') { queue.push(-2); e.preventDefault(); }
        }, true);
      });
      return {
        input: input,
        wanted: function () { return want; },
        set: function (on) {
          want = on;
          queue.length = 0;
          if (on) { reset(); input.focus({ preventScroll: true }); }
          else { input.blur(); Module.canvas.focus({ preventScroll: true }); }
        },
        next: function () { return queue.length ? queue.shift() : 0; }
      };
    })();

    // raylib's GLFW port listens for key events on the canvas, and the canvas is
    // tabindex="-1", so it does not take focus on its own: until the player
    // happens to click, the keyboard does nothing at all. Focus it as soon as
    // the page settles, and take focus back on every pointer contact (a click
    // inside the game must not leave focus on the document).
    (function () {
      var canvas = Module.canvas;
      var focus = function () {
        // While a text-entry screen is up the hidden input keeps the focus, so
        // the phone's keyboard stays (or, on iOS, comes) up.
        var target = window.orKbd.wanted() ? window.orKbd.input : canvas;
        target.focus({ preventScroll: true });
      };
      window.addEventListener('load', function () { setTimeout(focus, 0); });
      canvas.addEventListener('pointerdown', focus);
      canvas.addEventListener('touchstart', focus, { passive: true });
      canvas.addEventListener('touchend', focus, { passive: true });
      focus();
    })();

    // raylib re-reads the viewport on the window 'resize' event. iOS Safari's
    // toolbar show/hide fires visualViewport 'resize'/'scroll' but not always a
    // window 'resize', so bridge those, and nudge once after load for the
    // initial fit.
    (function () {
      var nudge = function () { window.dispatchEvent(new Event('resize')); };
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', nudge);
        window.visualViewport.addEventListener('scroll', nudge);
      }
      window.addEventListener('orientationchange', function () { setTimeout(nudge, 250); });
      window.addEventListener('load', function () { setTimeout(nudge, 0); setTimeout(nudge, 400); });
    })();
  </script>
  {{{ SCRIPT }}}
</body>
</html>
